 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
 
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
</head>

<body class="bg-gray-100">

 <header class="w-[90%] md:w-[80%] mx-auto mt-10">
  <h1 class="text-4xl md:text-6xl font-bold text-green-600 mb-8">
    Job Application Tracker
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl shadow">
      <p>Total</p>
      <p id="total" class="text-4xl font-bold">0</p>
    </div>

    <div class="bg-green-50 p-6 rounded-xl shadow">
      <p>Interview</p>
      <p id="interviewCount" class="text-4xl font-bold text-green-600">0</p>
    </div>

    <div class="bg-red-50 p-6 rounded-xl shadow">
      <p>Rejected</p>
      <p id="rejectedCount" class="text-4xl font-bold text-red-600">0</p>
    </div>
  </div>
</header>

<hr class="my-10 w-[90%] md:w-[80%] mx-auto">

<main class="w-[90%] md:w-[80%] mx-auto">

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold">Available Jobs</h2>
    <p id="jobsCount" class="font-medium">8 Jobs</p>
  </div>

  <div class="mb-6 space-x-3">
    <button onclick="toggleStyle('all-filter-btn')" id="all-filter-btn" class="bg-black text-white px-5 py-2 rounded">All</button>
    <button onclick="toggleStyle('interview-filter-btn')" id="interview-filter-btn" class="bg-gray-300 px-5 py-2 rounded">Interview</button>
    <button onclick="toggleStyle('rejected-filter-btn')" id="rejected-filter-btn" class="bg-gray-300 px-5 py-2 rounded">Rejected</button>
  </div>

  <section id="filtered-section" class="hidden"></section>

  <section id="allCards" class="space-y-6">

</body>
</html>
